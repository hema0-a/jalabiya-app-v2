<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فحص شامل للتطبيق</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Tahoma, Arial, sans-serif; background: #f5f5f5; padding: 12px; font-size: 14px; }
    h1 { font-size: 18px; background: #1F6D57; color: white; padding: 14px; border-radius: 8px; margin-bottom: 12px; }
    .summary { padding: 16px; border-radius: 8px; margin-bottom: 16px; text-align: center; font-size: 16px; color: white; font-weight: 700; }
    .summary.ok { background: linear-gradient(135deg, #2E7D32, #1B5E20); }
    .summary.warn { background: linear-gradient(135deg, #F57C00, #E65100); }
    .summary.fail { background: linear-gradient(135deg, #C62828, #8E0000); }
    .report { background: white; padding: 16px; border-radius: 8px; font-family: monospace; font-size: 12px; line-height: 1.8; white-space: pre-wrap; word-break: break-word; direction: rtl; text-align: right; max-height: 70vh; overflow-y: auto; border: 2px solid #ddd; }
    .copy-btn { display: block; width: 100%; padding: 14px; background: #1F6D57; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; margin-top: 12px; cursor: pointer; }
    .copy-btn:active { background: #123C2F; }
    .loading { text-align: center; padding: 40px; color: #666; }
  </style>
</head>
<body>

<h1>🔍 فحص شامل للتطبيق</h1>

<div id="result">
  <div class="loading">⏳ جاري الفحص... يرجى الانتظار</div>
</div>

<button class="copy-btn" id="copyBtn" style="display:none;" onclick="copyReport()">📋 نسخ التقرير</button>

<script type="module">
// ============================================================
// قائمة الملفات
// ============================================================
const jsFiles = [
  './js/core/config.js', './js/core/events.js', './js/core/utils.js',
  './js/core/storage.js', './js/core/db.js', './js/core/theme.js',
  './js/core/auth.js', './js/core/activity-log.js', './js/core/trash.js',
  './js/core/invoice.js', './js/core/notifications.js', './js/core/search.js',
  './js/core/order-grouping.js', './js/core/firebase-config.js',
  './js/core/cloud-auth.js', './js/core/sync.js', './js/core/daily-briefing.js',
  './js/core/fabric-pickup.js', './js/core/occasions.js', './js/core/auto-backup.js',
  './js/core/smart-sync.js', './js/core/image-compressor.js', './js/core/list-renderer.js',
  './js/ui/router.js', './js/ui/modal.js', './js/ui/toast.js',
  './js/ui/sidebar.js', './js/ui/topbar.js', './js/ui/universal-search.js',
  './js/ui/quick-preview.js', './js/ui/customization-manager.js', './js/ui/quick-actions.js',
  './js/pages/dashboard.js', './js/pages/customers.js', './js/pages/orders.js',
  './js/pages/payments.js', './js/pages/expenses.js', './js/pages/inventory.js',
  './js/pages/workers.js', './js/pages/commitments.js', './js/pages/house-expenses.js',
  './js/pages/loans.js', './js/pages/reports.js', './js/pages/kpis.js',
  './js/pages/settings.js', './js/pages/referrals.js', './js/pages/activity-log.js',
  './js/pages/trash.js', './js/pages/portfolio.js', './js/pages/pricing-calculator.js',
  './js/pages/cloud-sync.js', './js/pages/calendar.js', './js/pages/occasions.js',
  './js/pages/auto-messages-settings.js', './js/pages/backups.js',
  './js/pages/financial-center.js', './js/main.js'
];

let lines = [];
let passCount = 0;
let failCount = 0;

function log(text) {
  lines.push(text);
}

async function runCheck() {
  log('============================');
  log('📋 تقرير فحص التطبيق');
  log('التاريخ: ' + new Date().toLocaleString('ar-EG'));
  log('============================\n');

  // 1. فحص الملفات
  log('📁 [1] فحص ملفات JavaScript (' + jsFiles.length + ' ملف):');
  log('-------------------------------------------');
  
  for (const file of jsFiles) {
    try {
      await import(file);
      passCount++;
      log('✅ ' + file);
    } catch (e) {
      failCount++;
      log('❌ ' + file + ' → ' + e.message.slice(0, 80));
    }
  }
  log('');

  // 2. فحص الإعدادات الافتراضية
  log('⚙️ [2] فحص الإعدادات الافتراضية:');
  log('-------------------------------------------');
  try {
    const { DEFAULT_SETTINGS } = await import('./js/core/config.js');
    const required = [
      'workshopName', 'theme', 'darkMode', 'background', 'iconStyle',
      'fontFamily', 'fontSize', 'dailyOrderLimit', 'fabricPickupAlertDays',
      'enableMeasurementGrouping', 'customMeasurementFields',
      'lockScreenBackground', 'lockScreenMessage', 'occasionsAlertEnabled',
      'autoBackupEnabled', 'imageQuality', 'imageMaxSizeKB'
    ];
    for (const key of required) {
      if (DEFAULT_SETTINGS[key] !== undefined) {
        passCount++;
        log('✅ ' + key);
      } else {
        failCount++;
        log('❌ مفقود: ' + key);
      }
    }
  } catch (e) {
    failCount++;
    log('❌ فشل تحميل DEFAULT_SETTINGS: ' + e.message);
  }
  log('');

  // 3. فحص قاعدة البيانات
  log('💾 [3] فحص قاعدة البيانات:');
  log('-------------------------------------------');
  try {
    const { DEFAULT_DB } = await import('./js/core/config.js');
    const arrays = [
      'customers', 'orders', 'payments', 'expenses', 'inventory', 'workers',
      'commitments', 'houseExpenses', 'personalLoans', 'portfolio',
      'garmentTypes', 'occasions', 'activityLog', 'trash'
    ];
    for (const key of arrays) {
      if (Array.isArray(DEFAULT_DB[key])) {
        passCount++;
        log('✅ ' + key);
      } else {
        failCount++;
        log('❌ ليس مصفوفة: ' + key);
      }
    }
  } catch (e) {
    failCount++;
    log('❌ فشل تحميل DEFAULT_DB: ' + e.message);
  }
  log('');

  // 4. فحص الدوال الأساسية
  log('🎯 [4] فحص الدوال الأساسية:');
  log('-------------------------------------------');
  
  const functionsToCheck = [
    { file: './js/core/db.js', names: ['getCustomers', 'getOrders', 'getPayments', 'getExpenses', 'getOccasions'] },
    { file: './js/core/image-compressor.js', names: ['compressImage'] },
    { file: './js/core/list-renderer.js', names: ['initProgressiveList'] },
    { file: './js/core/auto-backup.js', names: ['createAutoBackup', 'getAutoBackups'] },
    { file: './js/core/smart-sync.js', names: ['initSmartSync', 'getSyncQueue'] },
    { file: './js/core/occasions.js', names: ['getOccasionsStats'] },
    { file: './js/core/auto-messages.js', names: ['sendWhatsAppMessage'] },
    { file: './js/core/fabric-pickup.js', names: ['getFabricPickupStats'] },
    { file: './js/core/daily-briefing.js', names: ['getGreeting', 'getDailySummary'] },
    { file: './js/core/invoice.js', names: ['printInvoice'] }
  ];
  
  for (const check of functionsToCheck) {
    try {
      const module = await import(check.file);
      const missing = check.names.filter(n => !module[n]);
      if (missing.length === 0) {
        passCount++;
        log('✅ ' + check.file);
      } else {
        failCount++;
        log('❌ ' + check.file + ' → مفقود: ' + missing.join(', '));
      }
    } catch (e) {
      failCount++;
      log('❌ فشل تحميل ' + check.file);
    }
  }
  log('');

  // النتيجة النهائية
  log('============================');
  log('📊 النتيجة النهائية:');
  log('============================');
  log('✅ نجح: ' + passCount);
  log('❌ فشل: ' + failCount);
  log('📊 المجموع: ' + (passCount + failCount));
  
  const percent = Math.round((passCount / (passCount + failCount)) * 100);
  log('📈 النسبة: ' + percent + '%');
  log('');
  
  if (failCount === 0) {
    log('🎉 ممتاز! كل شيء يعمل بشكل كامل.');
  } else {
    log('⚠️ يوجد ' + failCount + ' مشكلة تحتاج إصلاحاً.');
  }

  // عرض النتيجة
  const resultDiv = document.getElementById('result');
  const summaryClass = failCount === 0 ? 'ok' : (failCount < 5 ? 'warn' : 'fail');
  const summaryText = failCount === 0 
    ? '🎉 كل شيء يعمل بشكل كامل (' + percent + '%)' 
    : '⚠️ يوجد ' + failCount + ' مشكلة (' + percent + '%)';

  resultDiv.innerHTML = `
    <div class="summary ${summaryClass}">${summaryText}</div>
    <div class="report" id="reportText">${lines.join('\n')}</div>
  `;
  
  document.getElementById('copyBtn').style.display = 'block';
}

// دالة النسخ
window.copyReport = function() {
  const text = document.getElementById('reportText').innerText;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      document.getElementById('copyBtn').textContent = '✅ تم النسخ!';
      setTimeout(() => {
        document.getElementById('copyBtn').textContent = '📋 نسخ التقرير';
      }, 2000);
    }).catch(() => {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
};

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    document.getElementById('copyBtn').textContent = '✅ تم النسخ!';
    setTimeout(() => {
      document.getElementById('copyBtn').textContent = '📋 نسخ التقرير';
    }, 2000);
  } catch (e) {
    alert('انسخ النص يدوياً من الصفحة');
  }
  document.body.removeChild(ta);
}

runCheck();
</script>
</body>
</html>
