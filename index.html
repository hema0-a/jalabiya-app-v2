<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1F6D57">
  <meta name="description" content="تطبيق إدارة ورشة تفصيل الجلابيب">
  <title>ورشة تفصيل الجلابيب — V2.0</title>

  <!-- ============================================================
       PWA Manifest
       ============================================================ -->
  <link rel="manifest" href="manifest.json">

  <!-- أيقونات iOS (Apple) -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='38' fill='%231F6D57'/%3E%3Ctext x='90' y='125' font-size='100' text-anchor='middle' fill='white' font-family='Arial'%3E%F0%9F%A7%B5%3C/text%3E%3C/svg%3E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ورشة الجلابيب">

  <!-- ============================================================
       روابط ملفات التنسيق (CSS)
       ============================================================ -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/kanban.css">

  <!-- ============================================================
       معالج الأخطاء - يعرض أي خطأ على الشاشة مباشرة
       ============================================================ -->
  <script>
    window.addEventListener('error', function(e) {
      var app = document.getElementById('app');
      if (app && app.querySelector('.loading-screen')) {
        app.innerHTML = '<div style="padding:20px; font-family:sans-serif; direction:rtl;">' +
          '<h2 style="color:#c00; margin-bottom:12px;">⚠️ خطأ في التحميل</h2>' +
          '<p style="background:#fee; padding:12px; border-radius:8px; font-family:monospace; word-break:break-all; font-size:13px; line-height:1.6;">' +
            '<strong>الرسالة:</strong> ' + (e.message || 'فشل تحميل ملف') +
          '</p>' +
          '<p style="color:#666; font-size:12px; word-break:break-all; margin-top:8px;">' +
            '<strong>الملف:</strong> ' + (e.filename || 'غير معروف') + '<br>' +
            '<strong>السطر:</strong> ' + (e.lineno || '') +
          '</p>' +
          '<button onclick="location.reload()" style="padding:12px 24px; margin-top:16px; background:#1F6D57; color:white; border:none; border-radius:8px; font-size:14px; cursor:pointer;">إعادة التحميل</button>' +
        '</div>';
      }
    }, true);

    window.addEventListener('unhandledrejection', function(e) {
      var app = document.getElementById('app');
      if (app && app.querySelector('.loading-screen')) {
        app.innerHTML = '<div style="padding:20px; font-family:sans-serif; direction:rtl;">' +
          '<h2 style="color:#c00; margin-bottom:12px;">⚠️ خطأ غير متوقع</h2>' +
          '<p style="background:#fee; padding:12px; border-radius:8px; font-family:monospace; word-break:break-all; font-size:13px;">' +
            (e.reason ? (e.reason.message || String(e.reason)) : 'خطأ') +
          '</p>' +
          '<button onclick="location.reload()" style="padding:12px 24px; margin-top:16px; background:#1F6D57; color:white; border:none; border-radius:8px; font-size:14px; cursor:pointer;">إعادة التحميل</button>' +
        '</div>';
      }
    });

    // مؤقت احتياطي
    setTimeout(function() {
      var app = document.getElementById('app');
      if (app && app.querySelector('.loading-screen')) {
        app.innerHTML = '<div style="padding:20px; font-family:sans-serif; direction:rtl; text-align:center;">' +
          '<h2 style="color:#c00;">⚠️ التطبيق لا يستجيب</h2>' +
          '<p style="margin-top:12px;">لم يتم تحميل التطبيق خلال 8 ثوانٍ.</p>' +
          '<button onclick="location.reload()" style="padding:12px 24px; margin-top:16px; background:#1F6D57; color:white; border:none; border-radius:8px; font-size:14px; cursor:pointer;">إعادة التحميل</button>' +
        '</div>';
      }
    }, 8000);
  </script>
</head>
<body>
  <div id="app">
    <div class="loading-screen">
      <div class="spinner"></div>
      <p>جاري تحميل التطبيق...</p>
    </div>
  </div>

  <!-- ============================================================
       نقطة الدخول (ES6 Module)
       ============================================================ -->
  <script type="module" src="js/main.js"></script>

</body>
</html>
