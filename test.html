<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تشخيص الملفات</title>
  <style>
    body { font-family: monospace; padding: 16px; direction: ltr; background: #f5f5f5; font-size: 13px; }
    .ok { color: green; }
    .fail { color: red; font-weight: bold; background: #fee; padding: 4px; border-radius: 4px; display: block; margin-top: 4px; }
    h1 { font-size: 18px; margin-bottom: 12px; font-family: sans-serif; }
    .result { padding: 6px 0; border-bottom: 1px solid #ddd; word-break: break-all; }
    .done { margin-top: 16px; padding: 12px; background: #e0f7fa; border-radius: 8px; font-family: sans-serif; }
  </style>
</head>
<body>
  <h1>🔍 تشخيص الملفات</h1>
  <div id="results">جاري الفحص...</div>
  <script type="module">
    const files = [
      './js/core/config.js',
      './js/core/events.js',
      './js/core/utils.js',
      './js/core/storage.js',
      './js/core/db.js',
      './js/core/theme.js',
      './js/core/auth.js',
      './js/core/activity-log.js',
      './js/core/trash.js',
      './js/core/invoice.js',
      './js/ui/router.js',
      './js/ui/modal.js',
      './js/ui/toast.js',
      './js/ui/sidebar.js',
      './js/ui/topbar.js',
      './js/pages/dashboard.js',
      './js/pages/customers.js',
      './js/pages/orders.js',
      './js/pages/payments.js',
      './js/pages/expenses.js',
      './js/pages/inventory.js',
      './js/pages/workers.js',
      './js/pages/commitments.js',
      './js/pages/house-expenses.js',
      './js/pages/loans.js',
      './js/pages/reports.js',
      './js/pages/settings.js',
      './js/pages/referrals.js',
      './js/pages/activity-log.js',
      './js/pages/trash.js',
      './js/pages/pricing-calculator.js'
    ];
    
    const resultsDiv = document.getElementById('results');
    let html = '';
    let failCount = 0;
    
    for (const file of files) {
      try {
        await import(file);
        html += '<div class="result"><span class="ok">✅</span> ' + file + '</div>';
      } catch (e) {
        failCount++;
        html += '<div class="result"><span class="fail">❌ ' + file + '</span><br>&nbsp;&nbsp;&nbsp;→ ' + (e.message || 'unknown error') + '</div>';
      }
      resultsDiv.innerHTML = html;
    }
    
    html += '<div class="done"><strong>' + (failCount === 0 ? '✅ جميع الملفات موجودة وسليمة' : '⚠️ عدد الملفات المفقودة/المعطوبة: ' + failCount) + '</strong></div>';
    resultsDiv.innerHTML = html;
  </script>
</body>
</html>
